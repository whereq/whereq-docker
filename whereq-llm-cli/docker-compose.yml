# =============================================================================
# whereq-llm-cli — the interactive LLM CLI toolbox container
# =============================================================================
#   cp .env.example .env      # set LLM_PROVIDER + WQ_API_KEY
#   docker compose build
#   docker compose run --rm llm-cli                       # → shell
#   docker compose run --rm llm-cli claude               # → Claude Code
#   docker compose run --rm llm-cli codex "review this repo"
# =============================================================================
services:
  llm-cli:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Base + toolchains. Everything here is pinned to a known-good version;
        # bump one to move that component forward.
        UBUNTU_VERSION: "26.04"
        NODE_VERSION: "24.22.1"        # Node LTS (Krypton)
        PYTHON_VERSION: "3.15.1"       # newest stable CPython
        UV_VERSION: "0.13.5"
        # LLM CLIs
        CLAUDE_CODE_VERSION: "2.1.309"
        CODEX_VERSION: "0.163.0"
        COPILOT_VERSION: "1.0.103"
        # Trim the image: any of these to 0 drops that component entirely.
        INSTALL_MEDIA: "1"             # ffmpeg + imagemagick
        INSTALL_BUILD_TOOLS: "1"      # gcc/make, so `pip install` works live
        # Match your host user so bind-mounted files stay writable:
        # USER_UID: "${UID:-1000}"
        # USER_GID: "${GID:-1000}"
    image: whereq/llm-cli:latest
    container_name: llm-cli
    restart: unless-stopped
    stdin_open: true
    tty: true
    working_dir: /workspace

    environment:
      # Provider selection + credentials. The entrypoint fans these out to
      # ANTHROPIC_*/OPENAI_*/GEMINI_* for whichever CLI you launch.
      LLM_PROVIDER: "${LLM_PROVIDER:-anthropic}"
      WQ_API_KEY: "${WQ_API_KEY:-}"
      WQ_MODEL: "${WQ_MODEL:-}"
      TZ: "${TZ:-UTC}"
      # GitHub Copilot CLI needs a GitHub token — it does not use WQ_API_KEY.
      # GITHUB_TOKEN: "${GITHUB_TOKEN:-}"

    volumes:
      # ALL persistent state: credentials, sessions, per-CLI config, user-level
      # CLAUDE.md, git identity. Back this up and you have backed up your agent.
      - llm_config:/config
      # Your project. This is the CLI's working directory, so project-level
      # CLAUDE.md, edits and commits land here. Point it at your repo with
      # WORKSPACE in .env, or override per run:  -v "$PWD":/workspace
      - "${WORKSPACE:-./workspace}:/workspace"
      # Single-file alternative to putting keys in .env (Docker secrets style):
      # - ./llm-keys.env:/config/env:ro
      # Or override just one backend's profile:
      # - ./deepseek.env:/config/providers/deepseek.env:ro

    # Lets LLM_PROVIDER=ollama reach an Ollama on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # To talk to the whereq-ollama container directly instead of the host:
    # networks:
    #   - llm_net
    # networks:
    #   llm_net:
    #     external: true
    #     name: whereq-ollama_default

volumes:
  llm_config:
    name: llm_config
